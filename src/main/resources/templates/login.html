<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <style>
    body { font-family: Arial, sans-serif; display: grid; place-items: center; min-height: 90vh; background-color: #f4f4f4; }
    .container { background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 2rem; width: 300px; }
    h1 { text-align: center; color: #333; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 93%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background-color: #0056b3; }
    .message { text-align: center; margin-top: 1rem; }
    .message.error { color: red; }
    .message.success { color: green; }
    .message a { color: #007bff; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>Đăng nhập</h1>

  <div th:if="${param.error}" class="message error">Sai tên đăng nhập hoặc mật khẩu.</div>
  <div th:if="${param.register == 'success'}" class="message success">Đăng ký thành công! Vui lòng đăng nhập.</div>

  <form th:action="@{/login}" th:object="${loginRequest}" method="POST">
    <div class="form-group">
      <label for="username">Tên đăng nhập:</label>
      <input type="text" id="username" th:field="*{username}" required>
    </div>
    <div class="form-group">
      <label for="password">Mật khẩu:</label>
      <input type="password" id="password" th:field="*{password}" required>
    </div>
    <button type="submit">Đăng nhập</button>
  </form>
  <div class="message">
    Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
  </div>
</div>

</body>
</html>

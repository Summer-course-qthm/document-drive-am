<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
          <h1 class="h4 text-center mb-4">Đăng nhập Drive Space</h1>

          <div th:if="${param.error}" class="alert alert-danger py-2">Sai tên đăng nhập hoặc mật khẩu.</div>
          <div th:if="${param.register == 'success'}" class="alert alert-success py-2">Đăng ký thành công! Vui lòng đăng nhập.</div>

          <form th:action="@{/login}" th:object="${loginRequest}" method="POST" class="mb-3">
            <div class="mb-3">
              <label for="username" class="form-label">Tên đăng nhập</label>
              <input type="text" id="username" th:field="*{username}" class="form-control" required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Mật khẩu</label>
              <input type="password" id="password" th:field="*{password}" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
          </form>

          <p class="text-center mb-0">
            Chưa có tài khoản?
            <a href="/register" class="text-decoration-none">Đăng ký ngay</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>

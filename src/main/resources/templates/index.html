<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Trang chủ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body class="bg-light"> <div class="container mt-5 p-4 bg-white rounded shadow-sm">
    <header>
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3" sec:authorize="isAuthenticated()">
            <h1>
                Xin chào, <span class="text-primary" sec:authentication="principal.username">...</span>
            </h1>

            <form th:action="@{/logout}" method="POST">
                <button id="logoutButton" type="submit" class="btn btn-danger">Đăng xuất</button>
            </form>
        </div>
    </header>
    <main>
        <div class="d-flex justify-content-between align-items-center my-4">
            <h2>Danh sách Collection</h2>
            <a id="createCollectionBtn" th:href="@{/collection/new}" class="btn btn-primary">+ Tạo Collection Mới</a>
        </div>

        <div id="collection-list" class="list-group">

            <a th:each="col : ${danhSachCollection}"
               th:href="@{/collection(id=${col.id}, name=${col.name})}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">

                <strong class="text-primary" th:text="${col.name}">Tên Collection</strong>

                <small class="text-muted" th:text="'(Chủ sở hữu: ' + ${col.userid.fullname} + ')'"></small>
            </a>

            <div th:if="${#lists.isEmpty(danhSachCollection)}" class="list-group-item text-muted">
                Bạn chưa có collection nào.
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>

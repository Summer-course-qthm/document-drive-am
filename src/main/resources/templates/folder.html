<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Folder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold text-primary" href="/">Drive Space</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-link text-decoration-none" th:href="@{/collection(id=${collectionId})}">Collection</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-primary btn-sm">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<main class="container pb-5">
    <div class="bg-white border rounded-4 shadow-sm p-3 p-lg-4 mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-md-8">
                <p class="text-uppercase text-muted small mb-1">Folder hiện tại</p>
                <h1 class="h3 mb-1" th:text="${folderName}">Tên folder</h1>
                <p class="text-muted mb-0">Thuộc collection <span class="fw-semibold" th:text="${collectionName}">Collection</span></p>
            </div>
            <div class="col-md-4 text-md-end">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/collection(id=${collectionId})}">&larr; Trở lại collection</a>
            </div>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success rounded-4 border-0 shadow-sm" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger rounded-4 border-0 shadow-sm" th:text="${error}"></div>

    <div class="row g-4">
        <section class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <div>
                            <p class="text-uppercase text-muted small mb-1">Danh sách file</p>
                            <h2 class="h5 mb-0">Tài liệu hiện có</h2>
                        </div>
                        <span class="badge text-bg-light text-secondary px-3 py-2" th:text="${danhSachFile.size()} + ' file'">0 file</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th scope="col">Tên file</th>
                                <th scope="col" class="text-center">Kích thước</th>
                                <th scope="col" class="text-end">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="file : ${danhSachFile}">
                                <td>
                                    <div class="fw-semibold" th:text="${file.name}">Tên file</div>
                                    <div class="text-muted small" th:text="${file.type}">Loại file</div>
                                </td>
                                <td class="text-center text-muted">
                                    <span th:text="${file.size != null ? #numbers.formatDecimal(file.size / 1024.0, 1, 1) + ' KB' : '—'}">0 KB</span>
                                </td>
                                <td class="text-end">
                                    <a class="btn btn-outline-primary btn-sm me-2" th:href="@{/file/download(id=${file.id})}">Tải xuống</a>
                                    <form th:action="@{/file/delete}" method="post" class="d-inline">
                                        <input type="hidden" name="fileId" th:value="${file.id}">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">Xóa</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(danhSachFile)}">
                                <td colspan="3" class="text-center text-muted py-4">Folder này chưa có file nào.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <aside class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body">
                    <p class="text-uppercase text-muted small mb-2">Upload file</p>
                    <h2 class="h5 mb-3">Thêm tài liệu mới</h2>
                    <form th:action="@{/file/upload}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="fileInput" class="form-label">Chọn file</label>
                            <input id="fileInput" type="file" name="file" class="form-control" required>
                        </div>
                        <input type="hidden" name="folderId" th:value="${folderId}">
                        <button type="submit" class="btn btn-primary w-100">Tải lên</button>
                    </form>
                </div>
            </div>
        </aside>
    </div>
</main>
</body>
</html>

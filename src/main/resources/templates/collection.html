<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Collection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold text-primary" href="/">Drive Space</a>
        <div class="ms-auto">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-primary btn-sm">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<main class="container pb-5">
    <div class="bg-white border rounded-4 shadow-sm p-3 p-lg-4 mb-4">
        <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
            <div>
                <p class="text-uppercase text-muted small mb-1">Collection hiện tại</p>
                <h1 class="h3 mb-1" th:text="${collectionName}">Collection</h1>
                <p class="text-muted mb-0">Quản lý thư mục và tài liệu thuộc không gian này.</p>
            </div>
            <div class="text-md-end">
                <a href="/" class="btn btn-link text-decoration-none">Quay về trang chủ</a>
            </div>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success rounded-4 border-0 shadow-sm" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger rounded-4 border-0 shadow-sm" th:text="${error}"></div>

    <div class="row g-4">
        <section class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <div>
                            <p class="text-uppercase text-muted small mb-1">Danh sách thư mục</p>
                            <h2 class="h5 mb-0">Thư mục hiện có</h2>
                        </div>
                        <span class="badge text-bg-light text-secondary px-3 py-2" th:text="${danhSachFolder.size()} + ' thư mục'">0 thư mục</span>
                    </div>

                    <div class="list-group list-group-flush" th:if="${!#lists.isEmpty(danhSachFolder)}">
                        <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                           th:each="folder : ${danhSachFolder}"
                           th:href="@{/folder(id=${folder.id})}">
                            <div>
                                <div class="fw-semibold" th:text="${folder.name}">Tên folder</div>
                                <small class="text-muted">Nhấp để mở và xem file</small>
                            </div>
                            <span class="text-secondary">&rarr;</span>
                        </a>
                    </div>

                    <div class="text-center text-muted py-4" th:if="${#lists.isEmpty(danhSachFolder)}">
                        Chưa có thư mục nào trong collection này.
                    </div>
                </div>
            </div>
        </section>

        <aside class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body">
                    <p class="text-uppercase text-muted small mb-2">Tạo thư mục</p>
                    <h2 class="h5 mb-3">Sắp xếp tài liệu</h2>
                    <form th:action="@{/folder/create}" method="post" th:object="${newFolder}">
                        <div class="mb-3">
                            <label for="nameFolder" class="form-label">Tên folder</label>
                            <input id="nameFolder" type="text" th:field="*{nameFolder}" class="form-control" placeholder="VD: Hợp đồng 2024" required>
                        </div>
                        <input type="hidden" th:field="*{collectionId}">
                        <button type="submit" class="btn btn-primary w-100">Tạo folder</button>
                    </form>
                </div>
            </div>
        </aside>
    </div>
</main>
</body>
</html>

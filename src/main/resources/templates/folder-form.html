<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo Folder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3 text-center">Tạo folder mới</h1>
                    <form th:action="@{/folder/create}" method="post" th:object="${newFolder}">
                        <div class="mb-3">
                            <label for="folderName" class="form-label">Tên folder</label>
                            <input id="folderName" type="text" th:field="*{nameFolder}" class="form-control" placeholder="VD: Hợp đồng" required>
                        </div>
                        <input type="hidden" th:field="*{collectionId}">
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/collection(id=${collectionId})}" class="btn btn-outline-secondary">Hủy</a>
                            <button type="submit" class="btn btn-primary">Tạo folder</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
